<body>
<section class="dashboard-view staff-view" data-view="staff-announcements" aria-labelledby="staff-announcements-title" hidden>
  <header class="staff-page-heading">
    <div><h2 id="staff-announcements-title" tabindex="-1">Announcements</h2><p>Publish office updates for students and staff.</p></div>
    <span class="staff-count-pill"><strong id="staff-announcement-count">0</strong> published</span>
  </header>

  <div class="staff-announcement-layout">
    <section class="content-card staff-panel" aria-labelledby="staff-published-title">
      <header class="staff-panel-heading"><div><h3 id="staff-published-title">Published announcements</h3><p>Most recent updates appear first.</p></div></header>
      <div class="staff-announcement-list" id="staff-announcement-list"></div>
      <p class="staff-empty" id="staff-announcement-empty" hidden>No announcements have been published yet.</p>
    </section>

    <section class="content-card staff-panel" aria-labelledby="staff-compose-title">
      <header class="staff-panel-heading"><div><h3 id="staff-compose-title">New announcement</h3><p>Write a short update for the portal.</p></div></header>
      <form class="staff-announcement-form" id="staff-announcement-form">
        <div class="staff-form-field"><label for="staff-announcement-title">Title</label><input id="staff-announcement-title" name="title" type="text" maxlength="120" placeholder="e.g. Grade slip pickup schedule" required></div>
        <div class="staff-form-field"><label for="staff-announcement-message">Message</label><textarea id="staff-announcement-message" name="message" rows="5" maxlength="600" placeholder="Share the details students and staff need to know." required></textarea></div>
        <div class="staff-form-field"><label for="staff-announcement-audience">Audience</label><select id="staff-announcement-audience" name="audience"><option>Students</option><option>Staff</option><option>All</option></select></div>
        <button class="primary-button" type="submit">Publish announcement</button>
        <p class="staff-form-status" id="staff-announcement-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </div>
</section>
</body>
