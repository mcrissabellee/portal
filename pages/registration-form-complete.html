<body>
<section class="dashboard-view schedule-complete-view" data-view="registration-form-complete" aria-labelledby="registration-complete-title" hidden>
  <div id="registration-complete-content" hidden>
    <div class="schedule-complete-mark" aria-hidden="true"><svg class="portal-icon"><use href="#icon-check"/></svg></div>
    <h2 id="registration-complete-title" tabindex="-1">Schedule Complete!</h2>
    <p class="schedule-complete-message">Your selected schedule has been successfully processed and saved.</p>
    <div class="schedule-complete-card"><svg class="portal-icon" aria-hidden="true"><use href="#icon-calendar"/></svg><div><span class="schedule-complete-label">Schedule</span><time id="registration-complete-date"></time><p id="registration-complete-time"></p></div></div>
    <p class="schedule-complete-request" id="registration-complete-reference"></p>
    <div class="schedule-complete-actions"><a class="schedule-complete-dashboard" href="#/dashboard" data-page="dashboard">Back to Dashboard <svg class="portal-icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a></div>
  </div>
</section>
</body>
