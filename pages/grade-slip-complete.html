<body>
<section class="dashboard-view schedule-complete-view" data-view="grade-slip-complete" aria-labelledby="grade-slip-complete-title" hidden>
  <div id="grade-slip-complete-content" hidden>
    <div class="schedule-complete-mark"><svg class="portal-icon" aria-hidden="true"><use href="#icon-check"/></svg></div>
    <h2 id="grade-slip-complete-title" tabindex="-1">Schedule Complete!</h2>
    <p class="schedule-complete-message">Your selected schedule has been successfully saved.</p>
    <div class="schedule-complete-card"><svg class="portal-icon" aria-hidden="true"><use href="#icon-calendar"/></svg><div><span class="schedule-complete-label">Schedule</span><time id="grade-slip-complete-date"></time><p id="grade-slip-complete-time"></p></div></div>
    <p class="schedule-complete-request" id="grade-slip-complete-reference"></p>
    <div class="schedule-complete-actions"><a class="schedule-complete-dashboard" href="#/dashboard" data-page="dashboard">Back to Dashboard <svg class="portal-icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a><a class="schedule-complete-requests" href="#/my-request" data-page="requests">View My Request</a></div>
  </div>
</section>
